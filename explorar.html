<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore todos os restaurantes, padarias, parques e museus de Sorocaba no mapa.">
    <title>Descubra Sorocaba | Explorar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="brand-logo">Descubra<strong>Sorocaba</strong></a>
        <nav>
            <div>
                <a href="index.html">Início</a>
                <a href="explorar.html" class="active">Explorar</a>
                <a href="roteiros.html">Roteiros</a>
                <a href="galeria.html">Galeria</a>
                <a href="info.html">Sobre Nós</a>
            </div>
        </nav>
        <a href="info.html" class="btn-header">Contato</a>
    </header>

    <section class="catalog-section">
        <h2>Explore restaurantes, parques e atrações:</h2>

        <div class="search-bar-box">
            <input type="text" id="directorySearchInput" placeholder="Pesquisar por nome, bairro ou tipo de local (ex: Campolim, coxinha, parque...)">
            <button type="button" class="btn-primary" onclick="document.getElementById('googleMapsEmbed').scrollIntoView({behavior:'smooth'})">Ver Mapa</button>
        </div>

        <div class="filter-bar">
            <button type="button" class="filter-btn active" data-dir-filter="todos">Todos (12)</button>
            <button type="button" class="filter-btn" data-dir-filter="restaurantes">Restaurantes</button>
            <button type="button" class="filter-btn" data-dir-filter="cafes">Padarias & Bares</button>
            <button type="button" class="filter-btn" data-dir-filter="parques">Parques</button>
            <button type="button" class="filter-btn" data-dir-filter="cultura">História & Museus</button>
        </div>

        <div class="cards-grid" id="fullDirectoryGrid"></div>

        <div class="map-container">
            <iframe
                id="googleMapsEmbed"
                title="Mapa de Estabelecimentos de Sorocaba"
                loading="lazy"
                src="https://maps.google.com/maps?q=Restaurantes+e+Parques+Sorocaba+SP&t=&z=13&ie=UTF8&iwloc=&output=embed">
            </iframe>
        </div>
    </section>

    <footer>
        <div class="footer-logos">
            <span>Descubra<strong style="color:var(--primary);">Sorocaba</strong></span>
            <span>•</span>
            <span>Facens</span>
        </div>
        <div>
            <p>© 2026 Projeto acadêmico de Web Design – Descubra Sorocaba</p>
        </div>
    </footer>

    <a class="whatsapp-float" href="https://wa.me/5515999990000" target="_blank" rel="noopener noreferrer">Fale no WhatsApp</a>
    <script src="assets/js/main.js"></script>
</body>
</html>
